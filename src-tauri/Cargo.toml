[package]
name = "quiet-md"
version = "0.1.0"
description = "Quiet Markdown Editor"
authors = ["Yuya Kobayashi"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2"
notify = "8"
notify-debouncer-full = "0.5"
blake3 = "1"
walkdir = "2"
dunce = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
