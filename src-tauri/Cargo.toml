[package]
name = "quiet-md"
version = "0.1.2"
description = "Quiet Markdown Editor"
authors = ["Yuya Kobayashi"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2"
notify = "8"
notify-debouncer-full = "0.5"
blake3 = "1"
walkdir = "2"
dunce = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4.4"

# Explorer の右クリック登録（ADR-014）。HKCU だけを触る。
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# PDF 書き出し（ADR-021）。wry が使う webview2-com / windows と同じ版に揃える。
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation"] }
